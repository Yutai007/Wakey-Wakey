name: WakeyWakey
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    PRODUCT_BUNDLE_IDENTIFIER: com.yutai007.WakeyWakey
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    from: 5.0.1
targets:
  WakeyWakey:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    configFiles:
      Debug: WakeyWakey/Config/Base.xcconfig
      Release: WakeyWakey/Config/Base.xcconfig
    settings:
      base:
        INFOPLIST_FILE: WakeyWakey/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - path: WakeyWakey/App
      - path: WakeyWakey/Config
      - path: WakeyWakey/Models
      - path: WakeyWakey/Services
      - path: WakeyWakey/Utilities
      - path: WakeyWakey/ViewModels
      - path: WakeyWakey/Views
    resources:
      - path: WakeyWakey/Resources/Assets.xcassets
    dependencies:
      - package: SpotifyiOS
        product: SpotifyiOS
    scheme:
      gatherCoverageData: true
